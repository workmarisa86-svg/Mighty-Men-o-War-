<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div id="minimap"><canvas></canvas></div>
    <div id="compass"><div class="strip"></div><div class="needle"></div><div class="deg">000°</div></div>
    <div id="status"></div>
    <div id="crosshair" class="tool"><i></i><i></i><i></i><i></i></div>
    <div id="hitmark"></div>
    <div id="hint"></div>
    <div id="bigmsg"></div>
    <div id="scopeview">
      <div class="mask"></div>
      <div class="lens"><i class="glint"></i></div>
      <svg class="reticle sniper" viewBox="-100 -100 200 200" preserveAspectRatio="xMidYMid meet">
        <g stroke="#0c0c0a" fill="none">
          <path d="M-100 0H-28M28 0H100M0 -100V-28M0 28V100" stroke-width="2.4"/>
          <path d="M-28 0H-1.5M1.5 0H28M0 -28V-1.5M0 1.5V28" stroke-width="0.5"/>
          <g fill="#0c0c0a" stroke="none">
            <circle cx="-20" cy="0" r="0.9"/><circle cx="-10" cy="0" r="0.9"/><circle cx="10" cy="0" r="0.9"/><circle cx="20" cy="0" r="0.9"/>
            <circle cx="0" cy="-20" r="0.9"/><circle cx="0" cy="-10" r="0.9"/><circle cx="0" cy="10" r="0.9"/><circle cx="0" cy="20" r="0.9"/>
          </g>
          <path d="M-4 14H4M-6 20H6M-3 6H3" stroke-width="0.4"/>
          <circle r="0.6" fill="#a8261c" stroke="none"/>
        </g>
      </svg>
      <svg class="reticle binoc" viewBox="-100 -100 200 200" preserveAspectRatio="xMidYMid meet">
        <g stroke="#10100c" fill="none" stroke-width="0.5">
          <path d="M-40 0H40M0 -4V4"/>
          <path d="M-40 -2V2M-30 -1.5V1.5M-20 -2V2M-10 -1.5V1.5M10 -1.5V1.5M20 -2V2M30 -1.5V1.5M40 -2V2"/>
          <path d="M0 10V40M-2 20H2M-2 30H2"/>
        </g>
      </svg>
    </div>
    <div id="dmgdir"></div>
    <div id="markers"></div>
    <div class="ctx" id="ctxbar">
      <button data-btn="follow" class="cb" hidden></button>
      <button data-btn="orders" class="cb" hidden></button>
      <button data-btn="askiron" class="cb" hidden></button>
      <button data-btn="askweapon" class="cb" hidden></button>
      <button data-btn="chest" class="cb" hidden></button>
    </div>
    <div id="squadlist" hidden></div>
    <div id="mission" hidden><b></b><span></span><em></em></div>
    <div id="orderwheel" hidden></div>
    <div id="radio"></div>
    <div id="alertbar"></div>
    <svg id="digring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="15.9" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg>
    <div id="toasts"></div>
    <div id="craftbar" hidden><span class="label"></span><div class="track"><div class="fill"></div></div></div>
    <div id="selname"></div>
    <div id="bottom">
      <div id="bars">
        <div class="bar" id="hp"><span>+</span><div class="track"><div class="fill"></div></div></div>
        <div class="bar" id="food"><span>&#9673;</span><div class="track"><div class="fill"></div></div></div>
        <div id="hungerstate"></div>
        <div class="bar" id="breath" hidden><span>&#8776;</span><div class="track"><div class="fill"></div></div></div>
      </div>
      <div id="hotbar" class="hotbar"></div>
    </div>
    <div id="keyhint"></div>
    <div id="underwater"></div>
    <div id="flash"></div>
  </div>

  <div id="touch">
    <div class="stick"><div class="knob"></div></div>
    <div class="tbtns right">
      <div class="col">
        <button data-btn="zoom" class="tb" data-i18n="touch.zoom">ZOOM</button>
        <button data-btn="zin" class="tb zbtn">+</button>
        <button data-btn="zout" class="tb zbtn">−</button>
        <button data-btn="run" class="tb" data-i18n="touch.run">RUN</button>
        <button data-btn="crouch" class="tb" data-i18n="touch.crouch">CROUCH</button>
        <button data-btn="dive" class="tb" data-i18n="touch.dive">DIVE</button>
      </div>
      <div class="col">
        <button data-btn="jump" class="tb big" data-i18n="touch.jump">JUMP</button>
        <button data-btn="place" class="tb big" data-i18n="touch.place">PLACE</button>
        <button data-btn="dig" class="tb big" data-i18n="touch.dig">DIG</button>
      </div>
    </div>
    <div class="tbtns top">
      <button data-btn="light" class="tb" data-i18n="touch.light">LIGHT</button>
      <button data-btn="inv" class="tb" data-i18n="touch.inv">BAG</button>
      <button data-btn="craft" class="tb" data-i18n="touch.craft">CRAFT</button>
      <button data-btn="pause" class="tb">II</button>
    </div>
  </div>

  <!-- splash: shown by plain HTML + CSS while the game's scripts load -->
  <div id="splash" class="screen art-screen">
    <picture class="art"><source type="image/webp" sizes="(min-aspect-ratio: 155/100) 161vh, 100vw"
      srcset="img/mightyman-hero-640.webp 640w, img/mightyman-hero-1280.webp 1280w, img/mightyman-hero-1920.webp 1920w">
      <img src="img/mightyman-hero-1280.jpg" width="1280" height="796" alt="Mighty Men o' War — No one left behind" fetchpriority="high"></picture>
    <div class="menu-zone"><div class="loadbar busy"><div class="fill"></div></div></div>
  </div>
  <div id="screen" class="screen" hidden></div>

  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="js/main.js?v=1.3.1"></script>
</body>
</html>
