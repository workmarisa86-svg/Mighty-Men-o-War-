<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#23251b">
  <meta name="description" content="Mighty Men o' War — a 3D block-building war survival game.">
  <title>Mighty Men o' War</title>
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div id="minimap"><canvas></canvas></div>
    <div id="compass"><div class="strip"></div><div class="needle"></div><div class="deg">000°</div></div>
    <div id="status"></div>
    <div id="crosshair" class="tool"><i></i><i></i><i></i><i></i></div>
    <div id="hitmark"></div>
    <div id="hint"></div>
    <div id="bigmsg"></div>
    <div id="scope"><i></i></div>
    <div id="dmgdir"></div>
    <div id="markers"></div>
    <svg id="digring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="15.9" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg>
    <div id="toasts"></div>
    <div id="craftbar" hidden><span class="label"></span><div class="track"><div class="fill"></div></div></div>
    <div id="selname"></div>
    <div id="bottom">
      <div id="bars">
        <div class="bar" id="hp"><span>+</span><div class="track"><div class="fill"></div></div></div>
        <div class="bar" id="food"><span>&#9673;</span><div class="track"><div class="fill"></div></div></div>
        <div id="hungerstate"></div>
        <div class="bar" id="breath" hidden><span>&#8776;</span><div class="track"><div class="fill"></div></div></div>
      </div>
      <div id="hotbar" class="hotbar"></div>
    </div>
    <div id="keyhint"></div>
    <div id="binoc"></div>
    <div id="underwater"></div>
    <div id="flash"></div>
  </div>

  <div id="touch">
    <div class="stick"><div class="knob"></div></div>
    <div class="tbtns right">
      <div class="col">
        <button data-btn="zoom" class="tb" data-i18n="touch.zoom">ZOOM</button>
        <button data-btn="run" class="tb" data-i18n="touch.run">RUN</button>
        <button data-btn="crouch" class="tb" data-i18n="touch.crouch">CROUCH</button>
      </div>
      <div class="col">
        <button data-btn="jump" class="tb big" data-i18n="touch.jump">JUMP</button>
        <button data-btn="place" class="tb big" data-i18n="touch.place">PLACE</button>
        <button data-btn="dig" class="tb big" data-i18n="touch.dig">DIG</button>
      </div>
    </div>
    <div class="tbtns top">
      <button data-btn="light" class="tb" data-i18n="touch.light">LIGHT</button>
      <button data-btn="fly" class="tb" data-i18n="touch.fly">FLY</button>
      <button data-btn="inv" class="tb" data-i18n="touch.inv">BAG</button>
      <button data-btn="craft" class="tb" data-i18n="touch.craft">CRAFT</button>
      <button data-btn="pause" class="tb">II</button>
    </div>
  </div>

  <div id="screen" class="screen" hidden></div>

  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
